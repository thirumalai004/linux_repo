<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Page</title>
    <style>
      :root {
        --bg: #f4f7fb;
        --card: #ffffff;
        --primary: #2563eb;
        --text: #1f2937;
        --muted: #6b7280;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #eff6ff, #f8fafc);
        color: var(--text);
        display: grid;
        place-items: center;
        min-height: 100vh;
      }

      .card {
        background: var(--card);
        border-radius: 16px;
        box-shadow: 0 18px 40px rgba(37, 99, 235, 0.12);
        padding: 48px 40px;
        max-width: 560px;
        text-align: center;
      }

      .badge {
        display: inline-block;
        padding: 8px 14px;
        border-radius: 999px;
        background: #dbeafe;
        color: var(--primary);
        font-size: 12px;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        margin-bottom: 18px;
      }

      h1 {
        margin: 0;
        font-size: 2.4rem;
      }

      p {
        color: var(--muted);
        font-size: 1.05rem;
        line-height: 1.7;
        margin: 16px 0 0;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <div class="badge">Welcome</div>
      <h1>Hello, world! I am Alam Thiru</h1>
      <p>
        This is a simple HTML page added to the repository. You can open it in a browser
        to preview it.
      </p>
    </main>
  </body>
</html>
